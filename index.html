<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Barspillet</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #000F24;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  margin: 0;
  text-align: center;
  color: #C9AD72;
}

h1 { margin-bottom: 10px; }

button {
  background-color: #C9AD72;
  color: #000F24;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  padding: 12px 24px;
  cursor: pointer;
  margin-top: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: background-color 0.2s ease;
}

button:hover { background-color: #E0C58A; }

.steps {
  margin-top: 20px;
  font-size: 18px;
  text-align: left;
  max-width: 400px;
}

.controls {
  margin-top: 25px;
  display: none;
  gap: 15px;
}

.controls button { background-color: #C9AD72; }

.controls button:last-child { background-color: #C9AD72; }

.controls button:hover { opacity: 0.9; }

#drink-name {
  font-size: 28px;
  font-weight: bold;
  margin-top: 10px;
}
#source-note {
  position: fixed;
  bottom: 10px;
  right: 12px;
  font-size: 11px;
  color: #C9AD72;
  opacity: 0.7;
  margin: 0;
}

input.correct,
select.correct {
  background-color: #244B3B;
  color: #F3E7C8;
}

input.wrong,
select.wrong {
  background-color: #6A2934;
  color: #FFFFFF;
}

#extra-drinks-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
  background: #071A33;
  padding: 12px 16px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  font-size: 14px;
}

#extra-drinks-toggle label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

#extra-drinks-toggle input {
  width: 18px;
  height: 18px;
  cursor: pointer;
}


/* Logoet placeres øverst på siden og tilpasses skærmens bredde. */
#hotel-logo {
  display: block;
  width: min(420px, 78vw);
  height: auto;
  margin: 12px auto 18px;
}

</style>
</head>

const glassTypes = [
  "Highball",
  "Hvidvinsglas",
  "Rocks",
  "Cocktailglas"
  ];

let currentSteps = [];

function startGame() {
  document.getElementById("start-btn").style.display = "none";
  document.getElementById("controls").style.display = "flex";
  showRandomDrink();
}

function showRandomDrink() {
  const includeExtra = document.getElementById("include-extra-drinks").checked;

  const drinkPool = includeExtra
    ? { ...drinks, ...drinks_uden_for_kort }
    : drinks;

  const names = Object.keys(drinkPool);
  const randomName = names[Math.floor(Math.random() * names.length)];
  const steps = drinkPool[randomName];

  currentSteps = steps;

  document.getElementById("drink-name").textContent = randomName;

  const stepsDiv = document.getElementById("steps");
  stepsDiv.innerHTML = steps.map((step, i) => {
  if (Array.isArray(step) && step.length === 2) {

    if (step[0] === "Glas:") {
      return `
        <p>${step[0]}
          <select id="guess-${i}">
            <option value="">Vælg et glas...</option>
            ${glassTypes.map(glass =>
              `<option value="${glass}">${glass}</option>`
            ).join("")}
          </select>
        </p>`;
    }

    return `<p>${step[0]} <input type="text" id="guess-${i}" /></p>`;

  } else {
    return `<p>${step}</p>`;
  }
}).join("");

  steps.forEach((step, i) => {
    if (Array.isArray(step) && step.length === 2) {
      const inp = document.getElementById(`guess-${i}`);
      if (inp) inp.classList.remove("correct", "wrong");
    }
  });

  const oldRes = document.getElementById("result");
  if (oldRes) oldRes.remove();
}

document.getElementById("check-btn").addEventListener("click", () => {
  // Map correct ingredients by quantity
  let quantityMap = {};
  currentSteps.forEach(step => {
    if (Array.isArray(step) && step.length === 2) {
      if (!quantityMap[step[0]]) quantityMap[step[0]] = [];
      quantityMap[step[0]].push(step[1].toLowerCase());
    }
  });

  // Map user input by quantity
  let userMap = {};
  currentSteps.forEach((step, i) => {
    if (Array.isArray(step) && step.length === 2) {
      const input = document.getElementById(`guess-${i}`);
      const val = input.value.trim().toLowerCase();
      if (!userMap[step[0]]) userMap[step[0]] = [];
      if (val) userMap[step[0]].push({val: val, element: input});
    }
  });

  // Check each quantity group
  Object.keys(quantityMap).forEach(qty => {
    let correctIngredients = [...quantityMap[qty]]; // copy array
    const userInputs = userMap[qty] || [];

    userInputs.forEach(u => {
      const index = correctIngredients.indexOf(u.val);
      if (index !== -1) {
        u.element.classList.add("correct");
        u.element.classList.remove("wrong");
        correctIngredients.splice(index,1);
      } else {
        u.element.classList.add("wrong");
        u.element.classList.remove("correct");
      }
    });
  });

  // Count correct answers
  let correctCount = 0;
  currentSteps.forEach((step, i) => {
    if (Array.isArray(step) && step.length === 2) {
      const input = document.getElementById(`guess-${i}`);
      if (input.classList.contains("correct")) correctCount++;
    }
  });

  const total = currentSteps.filter(s => Array.isArray(s) && s.length === 2).length;
  const resultDiv = document.getElementById("result") || document.createElement("p");
  resultDiv.id = "result";
  resultDiv.textContent = `Du havde ${correctCount} ud af ${total} rigtige!`;
  document.getElementById("steps").appendChild(resultDiv);
});

// Facit-knap
document.getElementById("show-answer-btn").addEventListener("click", () => {
  currentSteps.forEach((step, i) => {
    if (Array.isArray(step) && step.length === 2) {
      const input = document.getElementById(`guess-${i}`);
      input.value = step[1]; // set correct answer
      input.classList.add("correct");
      input.classList.remove("wrong");
    }
  });
});
